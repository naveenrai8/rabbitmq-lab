[project]
name = "rabbitmq-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naveen Rai", email = "naveen.rai@salesforce.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=10.0",
    "pika>=1.3.2",
    "python3-pika>=0.9.14",
    "requests>=2.32",
    "rstream>=1.0",
]

[project.scripts]
rabbitmq-lab = "rabbitmq_lab:main"
simple-consumer = "rabbitmq_lab.simple.consumer:main"
simple-publisher = "rabbitmq_lab.simple.publisher:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
