[project]
name = "rabbitmq-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.0",
    "pika>=1.3.2",
    "python3-pika>=0.9.14",
    "requests>=2.32",
    "rstream>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]   # tell hatchling which top-level dir(s) to package
